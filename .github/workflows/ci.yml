name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-express:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: node-express } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm test

  fastapi:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fastapi } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - run: pytest

  gin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go mod tidy
      - run: go test ./...
