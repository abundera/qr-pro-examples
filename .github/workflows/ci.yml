name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-express:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: node-express } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm test

  fastapi:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fastapi } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # abundera-qr-pro is not on PyPI yet, so install the SDK from its repository
      # first; the editable install below then sees the dependency as satisfied.
      - run: pip install "git+https://github.com/abundera/qr-pro-sdk-python.git@main"
      - run: pip install -e ".[dev]"
      - run: pytest

  gin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go mod tidy
      - run: go test ./...
